name: App DTCar (gerar APK)

# Gera o APK do app do sistema (pasta app/) com o Android do próprio GitHub.
# Como usar (só o Danilo): GitHub > Actions > "App DTCar (gerar APK)" > Run workflow.
# O APK aparece no fim da execução, em "Artifacts" (DTCar-app-apk). Vale por 30 dias.
# É um APK de teste (assinatura de depuração): instala no celular sem Play Store. Cada geração usa uma chave nova,
# então uma versão nova do APK exige desinstalar a anterior. As telas, porém, NÃO dependem do APK: ele abre o app direto
# do site (server.url), então só precisa de APK novo quando mudar algo nativo (ícone, digital, permissões).
# Não usa nenhum segredo. Não cria release nem etiqueta.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O Android SDK já vem instalado no GitHub (ANDROID_HOME). Só aceita as licenças e garante a plataforma 34.
      - name: Prepara o Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Monta a pasta www (tela de sem internet e logo)
        run: python3 app/montar_www.py

      - name: Instala o Capacitor (versões travadas no package-lock)
        working-directory: app
        run: npm ci

      - name: Cria o projeto Android
        working-directory: app
        run: npx cap add android

      - name: Ajusta ícone, versão e segurança
        run: |
          python3 -m pip install pillow
          python3 app/preparar_android.py ${{ github.run_number }}

      - name: Copia as telas para o Android
        working-directory: app
        run: npx cap sync android

      - name: Gera o APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Confere o APK
        run: |
          APK=app/android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          unzip -p "$APK" assets/capacitor.config.json | grep -q "gestao.dtcarcentroautomotivo.com.br/app/"
          unzip -p "$APK" assets/public/index.html | grep -q "Sem internet"

      - uses: actions/upload-artifact@v4
        with:
          name: DTCar-app-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
