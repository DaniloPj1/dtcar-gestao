# Gera o instalador do DTCar Gestão para Windows e publica no GitHub Releases (o programa instalado se atualiza sozinho).
# Disparo: tag "programa-vX.Y.Z" (mesma versão do desktop/package.json) ou manualmente em Actions.
name: Programa para Windows
on:
  push:
    tags: ["programa-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalador:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # cria a versão (tag + release) antes do build: os arquivos sobem em paralelo e cada um tentava criar a release,
      # o que falhava com "Published releases must have a valid tag" (31/10, versões 1.1.0 e 1.1.1)
      - name: Criar a versão no GitHub
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          gh release view "programa-v$v" >/dev/null 2>&1 || gh release create "programa-v$v" --target "$GITHUB_SHA" --title "$v" --notes "Programa DTCar Gestão $v"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Gerar e publicar o instalador
        shell: bash
        run: |
          set -o pipefail
          npm run publicar 2>&1 | tee build.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # o log do Actions nem sempre é acessível de fora; o final do erro vira uma anotação (legível pela API)
      - name: Mostrar o erro
        if: failure()
        shell: bash
        run: |
          msg=$(tail -c 5000 build.log | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Falha ao gerar o instalador::$msg"
