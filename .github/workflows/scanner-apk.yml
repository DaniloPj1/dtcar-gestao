name: DTCar Scanner (gerar APK)

# Gera o APK do DTCar Scanner (pasta scanner/) — o app de diagnóstico por OBD do tablet da oficina.
# Como usar (só o Danilo): GitHub > Actions > "DTCar Scanner (gerar APK)" > Run workflow.
# O APK sai no fim da execução, em "Artifacts" (DTCar-scanner-apk). Vale por 30 dias.
# É um APK de teste (assinatura de depuração): instala no tablet sem Play Store. Cada geração usa chave nova,
# então versão nova exige desinstalar a anterior.
# As TELAS não dependem do APK: o app abre /scanner/ do site (server.url). Só precisa de APK novo quando
# mudar algo nativo (ícone, permissões, plugin do Bluetooth).
# Não usa nenhum segredo. Não cria release nem etiqueta.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanner/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepara o Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Monta a pasta www (tela de sem internet e logo)
        run: python3 scanner/montar_www.py

      - name: Instala o Capacitor (versões travadas no package-lock)
        working-directory: scanner
        run: npm ci

      - name: Cria o projeto Android
        working-directory: scanner
        run: npx cap add android

      - name: Ajusta ícone, versão e segurança
        run: |
          python3 -m pip install pillow
          python3 scanner/preparar_android.py ${{ github.run_number }}

      - name: Copia as telas para o Android
        working-directory: scanner
        run: npx cap sync android

      - name: Gera o APK
        working-directory: scanner/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Confere o APK
        run: |
          APK=scanner/android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          unzip -p "$APK" assets/capacitor.config.json | grep -q "gestao.dtcarcentroautomotivo.com.br/scanner/"
          unzip -p "$APK" assets/public/index.html | grep -q "Sem internet"

      - uses: actions/upload-artifact@v4
        with:
          name: DTCar-scanner-apk
          path: scanner/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
