name: SEFAZ – notas de compra
# Consulta a SEFAZ com o certificado A1 da DTCar (veja worker/sefaz.mjs).
# Roda a cada 10 minutos (manifestações pedidas na tela); a consulta de notas só acontece às 8h e 16h
# de Brasília ou quando pedida na tela.
# v49: às 8h e às 16h o Supabase dispara este workflow na hora (workflow_dispatch, pg_cron + pg_net); o agendamento
# de 10 em 10 minutos fica como reserva, porque o GitHub atrasa ou pula horários.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: sefaz
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sefaz:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: worker
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund --silent --prefix worker
      - name: Consultar a SEFAZ
        run: node worker/sefaz.mjs
        env:
          SUPABASE_URL: https://vbbklawlbxznsemkgtvg.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
