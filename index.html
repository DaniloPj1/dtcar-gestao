<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DTCar Gestão</title>
<meta name="description" content="Sistema da DTCar Centro Automotivo: check-in, orçamento, ordem de serviço e entrega.">
<meta name="theme-color" content="#161d27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__dtcarInstalar = e; window.dispatchEvent(new Event("dtcar-instalavel")); });
window.addEventListener("appinstalled", function () { window.__dtcarInstalar = null; window.dispatchEvent(new Event("dtcar-instalavel")); });</script>
<script>try { var t = JSON.parse(localStorage.getItem("dtcar-tema") || "null"); if (t === "claro" || t === "escuro") document.documentElement.dataset.tema = t; } catch (e) {}</script>
</head>
<body>
<div id="raiz"><div class="carregando">Carregando DTCar Gestão…</div></div>
<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
<script>
// se o programa não abrir em 12 s, explica o motivo em vez de ficar em "Carregando…"
setTimeout(function () {
  // só quando o sistema nem chegou a montar (as telas internas também mostram "Carregando…" e não contam)
  if (window.__dtcarMontou) return;
  var r = document.getElementById("raiz"); if (!r || !r.querySelector(".carregando")) return;
  var https = location.protocol === "https:" || location.hostname === "localhost" || !!window.dtcarDesktop;
  var msg = window.dtcarDesktop ? "O programa não conseguiu abrir as telas. Feche e abra de novo; se continuar, reinstale pelo site."
    : !https ? "Este endereço (http) não guarda o programa para uso sem internet. Abra <b>https://gestao.dtcarcentroautomotivo.com.br</b> e instale o ícone por ele."
    : !navigator.onLine ? "Sem internet, e o programa ainda não está guardado neste computador. Abra uma vez com internet (e espere carregar) para ele funcionar sem conexão."
    : "O programa está demorando para abrir. Confira a internet e tente de novo.";
  r.innerHTML = '<div class="carregando falha"><p>' + msg + '</p><button type="button" class="btn btn-pri" onclick="location.reload()">Tentar de novo</button></div>';
}, 12000);
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  // versão nova publicada: avisa na tela (botão "Atualizar agora"); se o programa estiver em segundo plano, atualiza sozinho
  var tinha = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function () { if (!tinha) return; window.__dtcarNovaVersao = true;
    if (document.visibilityState === "hidden") location.reload(); else window.dispatchEvent(new Event("dtcar-nova-versao")); });
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (r) { r.update(); setInterval(function () { r.update(); }, 30 * 60000); }).catch(function () {}); });
}
</script>
</body>
</html>
